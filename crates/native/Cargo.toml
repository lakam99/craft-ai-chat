[package]
name = "craft-ai-chat-native"
description = "Native HTTPS and OS credential storage for Craft AI Chat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
craft-ai-chat-core.workspace = true
serde_json.workspace = true
ureq = { version = "=3.5.0", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls-rustcrypto = "0.0.2-alpha"
sha2 = "0.10"
keyring = { version = "=3.6.3", default-features = false }

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
